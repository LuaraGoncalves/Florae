services:
  postgres:
    image: postgres:16-alpine
    container_name: florae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: florae
    ports:
      - "5432:5432"
    volumes:
      - florae_postgres_data:/var/lib/postgresql/data

volumes:
  florae_postgres_data:
